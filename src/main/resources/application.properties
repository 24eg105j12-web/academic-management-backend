server.port=8080

# Application Name
spring.application.name=academic-management-backend

# Allow circular references between Security and UserDetails beans
spring.main.allow-circular-references=true

# Database Configuration (MySQL 8.x with automatic H2 fallback)
spring.datasource.url=jdbc:mysql://localhost:3306/academic_ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable script runner so Hibernate & DataInitializer manage schema & seeding safely
spring.sql.init.mode=never

# JWT Security Settings
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# AI Configuration (OpenAI / Gemini compatible chat endpoint)
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key-for-local-demo}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Swagger & OpenAPI Documentation
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
